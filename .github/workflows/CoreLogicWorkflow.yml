# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CoreLogic

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore RobsSpacePatrol.CoreLogic.sln       

    - name: Build
      run: dotnet build RobsSpacePatrol.CoreLogic.sln --configuration Release --no-restore      

    # Independent tests
    - name: Test API (independent)
      run: dotnet run --project RobsSpacePatrol.Library.Tests --configuration Release --no-build
    
    - name: Create CoreLogic NuGet packages
      shell: pwsh
      run: |
        dotnet pack RobsSpacePatrol.Library/RobsSpacePatrol.Library.csproj `
          --configuration Release `
          --no-build `
          --output "${{ runner.temp }}/nuget-packages"
    
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to package RobsSpacePatrol.Library"
        }
    
        dotnet pack RobsSpacePatrol.DTO/RobsSpacePatrol.DTO.csproj `
          --configuration Release `
          --no-build `
          --output "${{ runner.temp }}/nuget-packages"
    
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to package RobsSpacePatrol.DTO"
        }
    
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: corelogic-nuget-packages
        path: ${{ runner.temp }}/nuget-packages/*.nupkg
        if-no-files-found: error
        retention-days: 30
