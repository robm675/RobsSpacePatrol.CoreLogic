# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CoreLogic

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prepare_release:
        description: 'Prepare CoreLogic package update pull requests'
        required: true
        type: boolean
        default: false

      merge_release:
        description: 'Approve and merge an existing coordinated release'
        required: true
        type: boolean
        default: false

      release_branch:
        description: 'Existing release branch name in CSharp and API'
        required: false
        type: string
        default: ''

concurrency:
  group: corelogic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Assign CI package versions
      shell: pwsh
      run: |
        $projects = @(
          'RobsSpacePatrol.Library/RobsSpacePatrol.Library.csproj',
          'RobsSpacePatrol.DTO/RobsSpacePatrol.DTO.csproj'
        )

        foreach ($project in $projects) {
          $content = [System.IO.File]::ReadAllText($project)

          $match = [regex]::Match(
            $content,
            '<Version>(\d+\.\d+\.\d+)</Version>'
          )

          if (-not $match.Success) {
            throw "Cannot find version in $project"
          }

          $baseVersion = $match.Groups[1].Value
          $ciVersion = "$baseVersion-ci.${{ github.run_id }}.${{ github.run_attempt }}"

          $updated = [regex]::Replace(
            $content,
            '<Version>\d+\.\d+\.\d+</Version>',
            "<Version>$ciVersion</Version>",
            1
          )

          [System.IO.File]::WriteAllText($project, $updated)

          Write-Host "$project => $ciVersion"
        }
        
    - name: Restore dependencies
      run: dotnet restore RobsSpacePatrol.CoreLogic.sln       

    - name: Build
      run: dotnet build RobsSpacePatrol.CoreLogic.sln --configuration Release --no-restore      

    # Independent tests
    - name: Test CoreLogic
      run: dotnet run --project RobsSpacePatrol.Library.Tests --configuration Release --no-build
    
    - name: Create CoreLogic NuGet packages
      shell: pwsh
      run: |
        dotnet pack RobsSpacePatrol.Library/RobsSpacePatrol.Library.csproj `
          --configuration Release `
          --no-build `
          --output "${{ runner.temp }}/nuget-packages"

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to package RobsSpacePatrol.Library"
        }

        dotnet pack RobsSpacePatrol.DTO/RobsSpacePatrol.DTO.csproj `
          --configuration Release `
          --no-build `
          --output "${{ runner.temp }}/nuget-packages"

        if ($LASTEXITCODE -ne 0) {
          throw "Failed to package RobsSpacePatrol.DTO"
        }

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: corelogic-nuget-packages
        path: ${{ runner.temp }}/nuget-packages/*.nupkg
        if-no-files-found: error
        retention-days: 30

  validate-consumers:
    name: Validate CSharp and API against new packages
    needs: build
    outputs:
      csharp_sha: ${{ steps.consumer-commits.outputs.csharp_sha }}
      api_sha: ${{ steps.consumer-commits.outputs.api_sha }}    
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/corelogic-validation-nuget-cache
    steps:
      - name: Checkout CoreLogic scripts
        uses: actions/checkout@v4
        with:
          path: RobsSpacePatrol.CoreLogic



      - name: Select consumer branches
        id: consumer-branches
        shell: pwsh
        env:
          CORELOGIC_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = $env:CORELOGIC_BRANCH

          foreach ($repo in @('RobsSpacePatrol.CSharp', 'RobsSpacePatrol.API')) {
            $selectedBranch = 'main'

            if ($branch -ne 'main') {
              $url = "https://github.com/robm675/$repo.git"
              $remoteRef = "refs/heads/$branch"

              $matches = @(git ls-remote --heads $url $remoteRef)

              if ($LASTEXITCODE -ne 0) {
                throw "Unable to check branches in $repo"
              }

              if ($matches.Count -gt 0) {
                $selectedBranch = $branch
              }
            }

            Write-Host "$repo => $selectedBranch"

            if ($repo -eq 'RobsSpacePatrol.CSharp') {
              "csharp_ref=$selectedBranch" >> $env:GITHUB_OUTPUT
            }
            else {
              "api_ref=$selectedBranch" >> $env:GITHUB_OUTPUT
            }
          }

      # For private consuming repositories, create a fine-grained GitHub PAT with
      # read-only Contents access to CSharp and API, stored as CROSS_REPO_READ_TOKEN
      # in CoreLogic's Actions repository secrets. Public repos can omit token: lines.
      - name: Checkout CSharp
        uses: actions/checkout@v4
        with:
          repository: robm675/RobsSpacePatrol.CSharp
          ref: ${{ steps.consumer-branches.outputs.csharp_ref }}
          path: RobsSpacePatrol.CSharp
          persist-credentials: false

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: robm675/RobsSpacePatrol.API
          ref: ${{ steps.consumer-branches.outputs.api_ref }}
          path: RobsSpacePatrol.API
          persist-credentials: false

      - name: Record consumer commits
        id: consumer-commits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $csharpSha = (git -C RobsSpacePatrol.CSharp rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot determine CSharp commit" }

          $apiSha = (git -C RobsSpacePatrol.API rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot determine API commit" }

          "csharp_sha=$csharpSha" >> $env:GITHUB_OUTPUT
          "api_sha=$apiSha" >> $env:GITHUB_OUTPUT

          Write-Host "Validated CSharp commit: $csharpSha"
          Write-Host "Validated API commit: $apiSha"






      - name: Download CoreLogic package artifact
        uses: actions/download-artifact@v4
        with:
          name: corelogic-nuget-packages
          path: ${{ runner.temp }}/corelogic-packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Stage package updates in temporary checkouts
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/Stage-CoreLogicPackages.ps1" `
            -Workspace $env:GITHUB_WORKSPACE `
            -PackagesPath "$env:RUNNER_TEMP/corelogic-packages"

      - name: Verify updated references and package files
        shell: pwsh
        run: |
          foreach ($repo in @('RobsSpacePatrol.CSharp', 'RobsSpacePatrol.API')) {
            Write-Host "Changes in $repo"
            git -C $repo status --short
            git -C $repo diff -- '*.csproj'
          }

      - name: Restore and build CSharp
        shell: pwsh
        run: |
          dotnet restore RobsSpacePatrol.CSharp/RobsSpacePatrol.CSharp.sln --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw 'CSharp restore failed' }
          dotnet build RobsSpacePatrol.CSharp/RobsSpacePatrol.CSharp.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'CSharp build failed' }

      - name: Run CSharp tests
        shell: pwsh
        run: |
          dotnet run --project RobsSpacePatrol.CSharp/RobsSpacePatrol.CLI.Library.Tests --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'CSharp tests failed' }

      - name: Restore and build API
        shell: pwsh
        run: |
          dotnet restore RobsSpacePatrol.API/RobsSpacePatrol.API.sln --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw 'API restore failed' }
          dotnet build RobsSpacePatrol.API/RobsSpacePatrol.API.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'API build failed' }

      - name: Verify SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Apply EF Core migrations
        shell: pwsh
        working-directory: RobsSpacePatrol.API
        env:
          ConnectionStrings__DefaultConnection: 'Server=(localdb)\MSSQLLocalDB;Database=RobsSpacePatrol_CI;Integrated Security=True;TrustServerCertificate=True;'
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install dotnet-ef"
          }

          dotnet ef database update `
            --project RobsSpacePatrol.API `
            --startup-project RobsSpacePatrol.API `
            --configuration Release

          if ($LASTEXITCODE -ne 0) {
            throw "EF Core migrations failed"
          }

      - name: Start API
        id: api-server
        shell: pwsh
        background: true
        working-directory: RobsSpacePatrol.API
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5067
          ConnectionStrings__DefaultConnection: 'Server=(localdb)\MSSQLLocalDB;Database=RobsSpacePatrol_CI;Integrated Security=True;TrustServerCertificate=True;'
        run: |
          dotnet run --project RobsSpacePatrol.API `
            --configuration Release `
            --no-build `
            --no-launch-profile

      - name: Check API availability
        shell: pwsh
        run: |
          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:5067/api/login/register" `
                -Method Get `
                -SkipHttpErrorCheck `
                -TimeoutSec 2

              Write-Host "API responding with HTTP $($response.StatusCode)"
              $ready = $true
              break
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ready) {
            throw "API did not become available."
          }

      - name: Register CI test accounts
        shell: pwsh
        env:
          CI_TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/Register-CITestAccounts.ps1"

      - name: Configure CI administrator
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/Configure-CIAdministrator.ps1"



      - name: Test CLI API Library (database)
        shell: pwsh
        working-directory: RobsSpacePatrol.API
        env:
          ROBSSPACEPATROL_API_TEST_URL: http://127.0.0.1:5067
          ROBSSPACEPATROL_API_TEST_USER: ci-user@example.com
          ROBSSPACEPATROL_API_TEST_ADMIN: ci-admin@example.com
          ROBSSPACEPATROL_API_TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}
        run: |
          dotnet run --project RobsSpacePatrol.CLI.API.Library.Tests `
            --configuration Release `
            --no-build `
            -- -trait "Category=Database"

          if ($LASTEXITCODE -ne 0) {
            throw "API database integration tests failed"
          }


      - name: Run API independent tests
        shell: pwsh
        run: |
          dotnet run --project RobsSpacePatrol.API/RobsSpacePatrol.API.Tests --configuration Release --no-build -- -trait- "Category=Database"
          if ($LASTEXITCODE -ne 0) { throw 'API independent tests failed' }

      # Full API integration validation and approved propagation are subsequent stages.
      # This job does not push, merge, or modify the remote consuming repositories.
      

      - name: Stop API
        cancel: api-server


  prepare-release-preview:
    name: Preview coordinated release
    needs: [build, validate-consumers]

    if: |
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/heads/feature/')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.prepare_release == true)

    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout CoreLogic scripts
        uses: actions/checkout@v4
        with:
          path: RobsSpacePatrol.CoreLogic

      - name: Checkout validated CSharp commit
        uses: actions/checkout@v4
        with:
          repository: robm675/RobsSpacePatrol.CSharp
          ref: ${{ needs.validate-consumers.outputs.csharp_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: RobsSpacePatrol.CSharp

      - name: Checkout validated API commit
        uses: actions/checkout@v4
        with:
          repository: robm675/RobsSpacePatrol.API
          ref: ${{ needs.validate-consumers.outputs.api_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: RobsSpacePatrol.API

      - name: Download validated NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: corelogic-nuget-packages
          path: ${{ runner.temp }}/corelogic-packages

      - name: Inspect validated consumer commits
        shell: pwsh
        env:
          CSHARP_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.csharp_sha }}
          API_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.api_sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/Inspect-ConsumerCommits.ps1"

      - name: Stage validated NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/Stage-CoreLogicPackages.ps1" `
            -Workspace $env:GITHUB_WORKSPACE `
            -PackagesPath "$env:RUNNER_TEMP/corelogic-packages"

          Write-Host "Validated NuGet packages staged successfully."

      - name: Create local release branches
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/Prepare-ReleaseBranches.ps1"

      - name: Verify release branches are current
        shell: pwsh
        env:
          CSHARP_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.csharp_sha }}
          API_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.api_sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/Verify-ReleaseBranches.ps1"

      - name: Preview proposed changes
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/Show-ReleasePreview.ps1"

      - name: Create immutable release manifest
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.prepare_release == true &&
          inputs.merge_release != true
        shell: pwsh
        env:
          CSHARP_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.csharp_sha }}
          API_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.api_sha }}
          RELEASE_BRANCH: release-preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/New-ReleaseManifest.ps1" -OutputPath "$env:RUNNER_TEMP/coordinated-release-manifest.json"

      - name: Upload immutable release manifest
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.prepare_release == true &&
          inputs.merge_release != true
        uses: actions/upload-artifact@v4
        with:
          name: coordinated-release-manifest
          path: ${{ runner.temp }}/coordinated-release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish release pull requests
      
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.prepare_release == true &&
          inputs.merge_release != true



        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_WRITE_TOKEN }}
          CSHARP_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.csharp_sha }}
          API_VALIDATED_SHA: ${{ needs.validate-consumers.outputs.api_sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_BRANCH: release-preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          & "$env:GITHUB_WORKSPACE/RobsSpacePatrol.CoreLogic/Scripts/CI/Publish-ReleasePRs.ps1"
       


  merge-release:
    name: Approve coordinated release
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.merge_release == true

    runs-on: ubuntu-latest

    environment: release-approval

    permissions:
      contents: read

    steps:
      - name: Checkout CoreLogic scripts
        uses: actions/checkout@v4

      - name: Merge and verify release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_WRITE_TOKEN }}
          CORELOGIC_TOKEN: ${{ github.token }}
          CSHARP_CI_WORKFLOW: ${{ vars.CSHARP_CI_WORKFLOW }}
          API_CI_WORKFLOW: ${{ vars.API_CI_WORKFLOW }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          DRY_RUN: 'false'
        run: bash Scripts/CI/Merge-Release.sh
